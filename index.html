<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OPUS MAGNUM MEDIA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #030303;
        overflow-x: hidden;
        color: #F5F5F5;
      }
      
      /* --- 3D & INFRASTRUCTURE STYLES --- */
      
      .perspective-container {
        perspective: 1000px;
        transform-style: preserve-3d;
      }

      /* The Grid - Visualizing the Fabric of the Net */
      .retro-grid {
        position: absolute;
        width: 200%;
        height: 200%;
        bottom: -50%;
        left: -50%;
        background-image: 
          linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        transform: rotateX(60deg);
        animation: grid-move 20s linear infinite;
        mask-image: linear-gradient(to bottom, transparent 0%, black 40%, black 80%, transparent 100%);
        pointer-events: none;
        z-index: 0;
      }

      @keyframes grid-move {
        0% { transform: rotateX(60deg) translateY(0); }
        100% { transform: rotateX(60deg) translateY(40px); }
      }

      /* Scanlines - The Monitor aesthetic */
      .scanlines {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          to bottom,
          rgba(255,255,255,0),
          rgba(255,255,255,0) 50%,
          rgba(0,0,0,0.02) 50%,
          rgba(0,0,0,0.02)
        );
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 9999;
      }

      /* Glassmorphism Panels */
      .glass-panel {
        background: rgba(10, 10, 10, 0.4);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
      }
      
      .holographic-card {
        background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.01) 100%);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.05);
        box-shadow: 0 0 15px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.5);
      }

      /* Text Decoding Effect */
      @keyframes decode {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }
      
      .mono-font {
        font-family: 'JetBrains Mono', monospace;
      }

      /* Animations */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .page-fade-in {
        animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }
      
      /* Warp Tunnel Animation */
      @keyframes warp-speed {
        0% { transform: scale(0.1) rotate(0deg); opacity: 0; }
        20% { opacity: 1; }
        100% { transform: scale(5) rotate(45deg); opacity: 0; }
      }
      
      .warp-tunnel {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100vw;
        height: 100vh;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, transparent 0%, transparent 20%, rgba(168, 85, 247, 0.05) 40%, rgba(59, 130, 246, 0.05) 100%);
        pointer-events: none;
        z-index: 0;
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #050505; 
      }
      ::-webkit-scrollbar-thumb {
        background: #333; 
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555; 
      }
      
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }

      /* Print Styles */
      @media print {
        body > #root > div > header,
        body > #root > div > footer,
        .no-print, .retro-grid, .scanlines {
          display: none !important;
        }
        body, html { background-color: #fff !important; color: #000 !important; }
        #root, #root > div, main { padding: 0 !important; margin: 0 !important; }
        #email-print-area { width: 100%; }
        #email-print-area > div { border: none !important; box-shadow: none !important; max-width: 100% !important; }
        @page { size: A4 portrait; margin: 1.5cm; }
      }
    </style>
